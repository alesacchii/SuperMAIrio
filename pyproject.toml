[project]
name = "supermairio"
version = "0.2.0"
description = "A real-time benchmark for System 1 decision models, played on Super Mario Bros 1-1."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
keywords = ["benchmark", "llm", "latency", "decision-making", "super-mario-bros", "nes"]
dependencies = [
    "gym-super-mario-bros==9.1.0",
    "gymnasium>=1.4.0",
    "httpx>=0.28.1",
    "nes-py==9.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyglet==1.5.31",
    "python-dotenv>=1.2.4",
]

[project.scripts]
supermairio = "supermairio.cli:main"

[project.urls]
Repository = "https://github.com/alesacchii/SuperMAIrio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supermairio"]

[tool.uv]
# nes-py's older upper bound selects 1.5.21, broken on Windows/Python 3.13.
# Keep the 1.5 API, using the maintenance release tested by this project.
override-dependencies = ["pyglet==1.5.31"]
