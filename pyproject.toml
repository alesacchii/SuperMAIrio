[project]
name = "supermairio"
version = "0.1.0"
description = "Modelli di decisione rapida giocano a Super Mario Bros a 60 FPS, con il gioco mai in pausa."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "gym-super-mario-bros==9.1.0",
    "gymnasium>=1.4.0",
    "httpx>=0.28.1",
    "nes-py==9.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyglet==1.5.31",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/alesacchii/SuperMAIrio"

[tool.uv]
package = false
# nes-py's older upper bound selects 1.5.21, broken on Windows/Python 3.13.
# Keep the 1.5 API, using the maintenance release tested by this project.
override-dependencies = ["pyglet==1.5.31"]
